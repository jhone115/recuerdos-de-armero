<!DOCTYPE html>

    <style>
        .flecha-siguiente {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            display: none;
        }
        
        .flecha-siguiente.mostrar {
            opacity: 1;
            visibility: visible;
            display: block;
        }
        
        .flecha-siguiente img {
            width: 60px;
            height: 60px;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));
        }
        .modal-audio {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .modal-audio.oculto {
            opacity: 0;
            pointer-events: none;
        }

        .contenido-modal {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .contenido-modal h2 {
            margin-bottom: 15px;
            color: #333;
        }

        .contenido-modal p {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.5;
        }

        .btn-activar-audio {
            background-color: #4a6fa5;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .btn-activar-audio:hover {
            background-color: #3a5a80;
        }

        .indicador-audio {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 1000;
            display: none;
        }

        .indicador-audio.mostrar {
            display: block;
        }
    </style>
</head>
<body>

        🔊 Audio activo

    <div class="modal-audio" id="modalAudio">

            <p>Para una experiencia completa, activa el audio de fondo. Haz clic en el botón para comenzar.</p>
            <button class="btn-activar-audio" id="btnActivarAudio">Activar Audio</button>

    </div>

    <div>

        </a>
        
        <a href="../../final.html" class="flecha-volver abajo-derecha" id="flecha-siguiente" style="display: none;">
            <img src="../../recursos/imagenes/adelante.png" alt="Siguiente sección">
        </a>
        
        <div class="container-b">
            <audio id="bgMusic" loop>
                <source src="../../recursos/sonoros/b.mp3" type="audio/mpeg">
                Tu navegador no soporta el elemento de audio.
            </audio>
            <div class="galeria">

Eso nos obligó a empezar desde cero. Después de haber tenido una población de 35.000 habitantes, ahora apenas llegamos a 15.000.">
                    <img src="../../recursos/imagenes/imagenes armero destruido/DSC_0008.jpg" alt="Armero destruido">
                </a>

                <a href="b_exp.html" class="item-galeria polaroid-b" 
                   data-texto="B2"
                   data-imagen="../../recursos/imagenes/imagenes armero destruido/pagina 6 fotografia 2.png" 
                   data-descripcion="Armero...">
                    <img src="../../recursos/imagenes/imagenes armero destruido/pagina 6 fotografia 2.png" alt="Armero destruido">
                </a>

                <a href="b_exp.html" class="item-galeria polaroid-b" 
                   data-texto="B3"
                   data-imagen="../../recursos/imagenes/imagenes armero destruido/DSC_0011.jpg" 
                   data-descripcion="Aun...">
                    <img src="../../recursos/imagenes/imagenes armero destruido/DSC_0011.jpg" alt="Armero destruido">
                </a>

                <a href="b_exp.html" class="item-galeria polaroid-b" 
                   data-texto="B4"
                   data-imagen="../../recursos/imagenes/imagenes armero destruido/DSC_0001.jpg" 
                   data-descripcion="Vive...">
                    <img src="../../recursos/imagenes/imagenes armero destruido/DSC_0001.jpg" alt="Armero destruido">

                </a>
            </div>
        </div>
    </div>
    <script>
        const AUDIO_STORAGE_KEY = 'audioEstadoArmeroB';
        
        document.addEventListener('DOMContentLoaded', function() {
            const audio = document.getElementById('bgMusic');
            const modalAudio = document.getElementById('modalAudio');
            const btnActivarAudio = document.getElementById('btnActivarAudio');
            const indicadorAudio = document.getElementById('indicadorAudio');
            
            const estadoAudioGuardado = localStorage.getItem(AUDIO_STORAGE_KEY);
            
            if (estadoAudioGuardado) {
                const estadoAudio = JSON.parse(estadoAudioGuardado);
                
                if (estadoAudio.reproduciendo) {
                    audio.currentTime = estadoAudio.tiempoActual || 0;
                    
                    modalAudio.classList.add('oculto');
                    
                    indicadorAudio.classList.add('mostrar');
                    
                    audio.play().then(() => {
                        console.log("Audio continuado desde:", audio.currentTime);
                    }).catch(error => {
                        console.log("No se pudo continuar automáticamente:", error);
                        modalAudio.classList.remove('oculto');
                        indicadorAudio.classList.remove('mostrar');
                    });
                } else {
                    audio.currentTime = estadoAudio.tiempoActual || 0;
                    modalAudio.classList.add('oculto');
                }
            }
            
            btnActivarAudio.addEventListener('click', function() {
                audio.play().then(function() {
                    modalAudio.classList.add('oculto');
                    
                    indicadorAudio.classList.add('mostrar');
                    
                    guardarEstadoAudio(audio);
                }).catch(function(error) {
                    console.error("Error al reproducir el audio:", error);
                    alert("No se pudo reproducir el audio. Por favor, verifica que tu navegador permita la reproducción de audio.");
                });
            });
            
            setInterval(function() {
                guardarEstadoAudio(audio);
            }, 1000);
            
            window.addEventListener('beforeunload', function() {
                guardarEstadoAudio(audio);
            });
            
            function guardarEstadoAudio(audioElement) {
                const estadoAudio = {
                    reproduciendo: !audioElement.paused,
                    tiempoActual: audioElement.currentTime,
                    volumen: audioElement.volume,
                    timestamp: Date.now()
                };
                
                localStorage.setItem(AUDIO_STORAGE_KEY, JSON.stringify(estadoAudio));
            }
            
            setInterval(function() {
                const estadoAudioGuardado = localStorage.getItem(AUDIO_STORAGE_KEY);
                if (estadoAudioGuardado) {
                    const estadoAudio = JSON.parse(estadoAudioGuardado);
                    const tiempoTranscurrido = Date.now() - estadoAudio.timestamp;
                    
                    if (tiempoTranscurrido > 30 * 60 * 1000) {
                        localStorage.removeItem(AUDIO_STORAGE_KEY);
                    }
                }
            }, 5 * 60 * 1000);
        });
    </script>
    <script src="b.js"></script>
</body>
